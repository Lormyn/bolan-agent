[project]
name = "bolan-agent"
version = "0.3.0"
description = "AI-driven Swedish mortgage agent demo using ADK 2.0 with A2A and A2UI."
authors = [
    {name = "Erik Wallström"},
]
dependencies = [
    "google-adk>=2.0.0b0",
]
requires-python = ">=3.10,<3.14"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.agents-cli]
name = "bolan-agent"
description = "Multi-agent Swedish mortgage application system"
base_template = "adk"
agent_directory = "app"
